[project]
name = "voice-loop"
version = "0.1.0"
description = "Phone-call voice loop prototype: Pipecat + local STT/TTS + Claude Code over ACP"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol==0.12.*",
    "aiohttp>=3.14.5",
    "httpx>=0.28.1",
    "pipecat-ai[kokoro,local-smart-turn-v3,runner,silero,webrtc,whisper]==1.15.*",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]
