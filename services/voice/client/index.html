<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe voice loop</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fbfbfd; --card: #fff; --line: #e5e5ea; --accent: #0a84ff; --bad: #d70015; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #111113; --card: #1c1c1e; --line: #2c2c2e; } }
  body { font: 15px/1.45 -apple-system, system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 10px 22px; border-radius: 999px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button.hang { background: var(--bad); }
  .meter { width: 120px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--accent); transition: width 60ms; }
  #status { color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  #log { max-height: 340px; overflow: auto; }
  .msg { margin: 4px 0; } .msg b { display: inline-block; min-width: 52px; color: var(--muted); font-weight: 500; }
  .msg.bot b { color: var(--accent); } .msg.sys { color: var(--muted); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, td.txt, th.txt { text-align: left; }
  td.txt { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .key { font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Vibe voice loop</h1>
  <p class="sub">Phone-call prototype: local STT/TTS, Claude Code over ACP. Use a headset.</p>
  <div class="bar">
    <button id="btn">Call</button>
    <span>mic</span><div class="meter"><div id="micm"></div></div>
    <span>bot</span><div class="meter"><div id="botm"></div></div>
    <span id="status">idle</span>
  </div>
  <div class="grid">
    <div class="card"><h2>Conversation</h2><div id="log"></div></div>
    <div class="card"><h2>Per-turn latency (ms after you stopped speaking)</h2>
      <table><thead><tr><th>#</th><th>eot</th><th>ack</th><th>stt</th><th>prompt</th><th>1st chunk</th><th>1st tts</th><th class="key">1st agent audio</th><th>tools</th><th class="txt">you said</th></tr></thead><tbody id="turns"></tbody></table>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const now = () => performance.timeOrigin + performance.now();
// Instrumentation for the e2e test: audio on/off transitions as heard by this page (epoch ms).
window.vl = { audio: [], events: [], state: "idle", connectedAt: null };

let pc, dc, micStream, pingTimer, actx, es;

function logMsg(cls, who, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = who ? `<b>${who}</b> ` : "";
  d.appendChild(document.createTextNode(text));
  $("log").appendChild(d);
  $("log").scrollTop = 1e9;
}

const params = new URLSearchParams(location.search);
function setStatus(s) { $("status").textContent = s; window.vl.state = s.startsWith("connected") ? "connected" : s; }

// Level meter + onset detector on a MediaStream.
function watchLevel(stream, meterEl, src) {
  const node = actx.createMediaStreamSource(stream);
  const an = actx.createAnalyser();
  an.fftSize = 512;
  node.connect(an);
  const buf = new Float32Array(an.fftSize);
  let on = false, lastLoud = 0, seg = null;
  return setInterval(() => {
    an.getFloatTimeDomainData(buf);
    let s = 0; for (const v of buf) s += v * v;
    const rms = Math.sqrt(s / buf.length);
    meterEl.style.width = Math.min(100, rms * 400) + "%";
    const t = now();
    if (rms > 0.01) {
      lastLoud = t;
      if (!on) { on = true; seg = { src, on: t, off: null }; window.vl.audio.push(seg); }
    } else if (on && t - lastLoud > 150) {
      on = false; seg.off = lastLoud;
    }
  }, 10);
}

function fmt(v) { return v == null ? "" : Math.round(v); }

function addTurn(rec) {
  const t = rec.t || {}, base = t.speech_end;
  const rel = (k) => (base && t[k] ? t[k] - base : null);
  const tools = (rec.tools || []).map((x) => x.title.replace("mcp__voice__", "")).join(", ");
  const tr = document.createElement("tr");
  const said = rec.kind === "event" ? "[event] " + (rec.event_text || "") : (rec.user_text || "");
  tr.innerHTML = `<td>${rec.turn}${rec.barge_in_while ? " ✂" : ""}</td><td>${fmt(rel("eot_decision"))}</td><td>${fmt(rel("ack_out"))}</td>` +
    `<td>${fmt(rel("stt_result"))}</td><td>${fmt(rel("prompt_sent"))}</td><td>${fmt(rel("first_chunk"))}</td>` +
    `<td>${fmt(rel("tts_first_audio"))}</td><td class="key">${fmt(rel("first_audio_out"))}</td><td>${tools}</td><td class="txt"></td>`;
  tr.lastChild.textContent = said;
  $("turns").prepend(tr);
}

function openEvents() {
  es = new EventSource("events");
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    window.vl.events.push(ev);
    if (ev.type === "user") logMsg("user", "you", ev.text);
    else if (ev.type === "bot") logMsg("bot", "vibe", ev.text + (ev.cancelled ? " ✂" : ""));
    else if (ev.type === "tool") logMsg("sys", "", "tool: " + ev.title.replace("mcp__voice__", ""));
    else if (ev.type === "event") logMsg("sys", "", "event: " + ev.text);
    else if (ev.type === "barge_in") logMsg("sys", "", "barge-in" + (ev.bot_speaking ? "" : " (agent was thinking)"));
    else if (ev.type === "turn" && ev.turn.kind !== "orphan") addTurn(ev.turn);
    else if (ev.type === "status") { logMsg("sys", "", `call ${ev.text}` + (ev.backend ? ` (speech: ${ev.backend})` : "")); }
  };
}

function waitIce(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((res) => {
    const done = () => { if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", done); res(); } };
    pc.addEventListener("icegatheringstatechange", done);
    setTimeout(res, 2000); // host candidates only: gathering is quick, don't hang on a slow interface
  });
}

async function connect() {
  setStatus("starting mic");
  actx = new AudioContext();
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
  });
  watchLevel(micStream, $("micm"), "mic");
  if (!es) openEvents();

  pc = new RTCPeerConnection({ iceServers: [] }); // tailnet: host candidates are enough
  pc.addTransceiver(micStream.getAudioTracks()[0], { direction: "sendrecv" });
  dc = pc.createDataChannel("chat");
  dc.onopen = () => { pingTimer = setInterval(() => dc.readyState === "open" && dc.send("ping: " + Date.now()), 1000); };
  pc.ontrack = (e) => {
    const audio = new Audio();
    audio.autoplay = true;
    audio.srcObject = e.streams[0] || new MediaStream([e.track]);
    audio.play().catch(() => {});
    document.body.appendChild(audio);
    watchLevel(audio.srcObject, $("botm"), "bot");
  };
  pc.onconnectionstatechange = () => {
    setStatus(pc.connectionState);
    if (pc.connectionState === "connected") {
      window.vl.connectedAt = now();
      setTimeout(async () => { const p = await selectedPair(); window.vl.pair = p; if (p) setStatus(`connected via ${p.local} ⇄ ${p.remote}`); }, 500);
    }
  };

  setStatus("connecting");
  await pc.setLocalDescription(await pc.createOffer());
  await waitIce(pc);
  let sdp = pc.localDescription.sdp;
  if (params.get("ice") === "tailnet") {
    // debug: offer only candidates on the tailscale interface (100.64.0.0/10)
    sdp = sdp.split("\r\n").filter((l) => !l.startsWith("a=candidate") || / 100\.\d+\.\d+\.\d+ /.test(l)).join("\r\n");
  }
  const r = await fetch("api/offer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp, type: pc.localDescription.type }),
  });
  if (!r.ok) throw new Error("offer failed: " + r.status);
  await pc.setRemoteDescription(await r.json());
  $("btn").textContent = "Hang up";
  $("btn").classList.add("hang");
}

function hangup() {
  clearInterval(pingTimer);
  if (pc) pc.close();
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  pc = null;
  setStatus("idle");
  $("btn").textContent = "Call";
  $("btn").classList.remove("hang");
}

$("btn").onclick = () => (pc ? hangup() : connect().catch((e) => { setStatus("error: " + e.message); hangup(); }));
// The ICE candidate pair media actually uses (shown in the status line, read by the e2e test).
async function selectedPair() {
  if (!pc) return null;
  const stats = await pc.getStats();
  let pair = null;
  stats.forEach((r) => { if (r.type === "transport" && r.selectedCandidatePairId) pair = stats.get(r.selectedCandidatePairId); });
  if (!pair) stats.forEach((r) => { if (r.type === "candidate-pair" && r.nominated && r.state === "succeeded") pair = r; });
  if (!pair) return null;
  const l = stats.get(pair.localCandidateId), rm = stats.get(pair.remoteCandidateId);
  return { local: `${l.address}:${l.port} ${l.candidateType}/${l.protocol}`, remote: `${rm.address}:${rm.port} ${rm.candidateType}/${rm.protocol}`, rtt: pair.currentRoundTripTime };
}
window.vlPair = selectedPair;
window.vlConnect = connect;
window.vlHangup = hangup;
if (params.has("autoconnect")) connect().catch((e) => setStatus("error: " + e.message));
</script>
</body>
</html>
