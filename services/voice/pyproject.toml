[project]
name = "voice-worker"
version = "0.2.0"
description = "Vibe Center voice worker: Pipecat call pipeline (WebRTC, VAD, Smart Turn, STT/TTS) bridged to the app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp==3.14.5",
    "httpx==0.28.1",
    "pipecat-ai[kokoro,local-smart-turn-v3,runner,silero,webrtc,whisper]==1.15.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.14.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
